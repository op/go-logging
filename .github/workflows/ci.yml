name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Run daily at 2 AM UTC to check for new vulnerabilities
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

      - name: Build
        run: go build -v ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ${{ matrix.go-version }}

      - name: Test
        run: go test -race ./...
